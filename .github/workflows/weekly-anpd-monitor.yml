name: Weekly ANPD Monitor

on:
  workflow_dispatch:
    inputs:
      days:
        description: Dias calendario a revisar
        default: "7"
        required: true
  schedule:
    # GitHub Actions usa UTC. Mantener sincronizado con ANPD_WEEKLY_CRON_UTC en los secretos/variables del repositorio.
    - cron: "0 13 * * 1"

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      ANPD_USER_AGENT: ${{ vars.ANPD_USER_AGENT || 'anpd-monitor-github-actions/0.1' }}
      ANPD_DATA_DIR: data
      ANPD_DATABASE_PATH: data/anpd_monitor.sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Validate sources
        run: python -m anpd_monitor validate-sources
      - name: Run monitor
        run: python -m anpd_monitor run --days "${{ inputs.days || '7' }}"
      - name: Read run summary
        id: summary
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json
          latest = sorted(glob.glob("data/reports/anpd_report_*.json"))[-1]
          p = json.load(open(latest, encoding="utf-8"))
          s = p["summary"]
          cats = sorted({d["category"] for d in p["new_documents"]})
          print(f"new={s['new_documents']}")
          print(f"existing={s['existing_documents']}")
          print(f"errors={s['errors']}")
          print(f"manual={s['manual_review']}")
          print(f"categories={', '.join(cats) or '-'}")
          PY
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: anpd-monitor-reports
          path: data/reports/
      - name: Deploy dashboard to Vercel
        if: success() && env.VERCEL_TOKEN != ''
        working-directory: docs/platform
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_kR8Ga3bEldZpM89TfeQ3zaen
          VERCEL_PROJECT_ID: prj_HPejjxce9N8T77NaItvdz3kn0i1W
        run: |
          npm install --global vercel@latest
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
      - name: Email alert on new documents
        if: success() && steps.summary.outputs.new != '0' && env.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@v3
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_APP_PASSWORD }}
          from: ANPD Monitor <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_USERNAME }}
          subject: "[ANPD Monitor] ${{ steps.summary.outputs.new }} documento(s) nuevo(s)"
          body: |
            El monitor semanal detecto ${{ steps.summary.outputs.new }} documento(s) nuevo(s).

            Categorias: ${{ steps.summary.outputs.categories }}
            Ya registrados: ${{ steps.summary.outputs.existing }}
            Revision manual: ${{ steps.summary.outputs.manual }}
            Errores: ${{ steps.summary.outputs.errors }}

            Panel: https://web-scraping-juridico.vercel.app/dashboard/

