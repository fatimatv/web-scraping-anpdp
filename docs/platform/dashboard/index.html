<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ANPD Monitor - Panel del ultimo run</title>
<style>
  :root {
    --bg: #f6f5f1;
    --card: #ffffff;
    --ink: #1a1f2b;
    --muted: #5b6472;
    --line: #e3e1da;
    --ok: #2f7d5b;
    --warn: #b8791f;
    --err: #b23a3a;
    --accent: #1a1f2b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 24px 80px; }
  header { border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 28px; }
  h1 { margin: 0 0 6px; font-size: 22px; letter-spacing: -0.01em; }
  header p { margin: 2px 0; color: var(--muted); font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .kpi .n { font-size: 26px; font-weight: 600; line-height: 1; margin-bottom: 4px; }
  .kpi .lbl { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .kpi.err .n { color: var(--err); }
  .kpi.warn .n { color: var(--warn); }
  .kpi.ok .n { color: var(--ok); }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 20px; margin-bottom: 18px; }
  section h2 { margin: 0 0 12px; font-size: 15px; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); font-weight: 600; }
  ul.sources { list-style: none; padding: 0; margin: 0; }
  ul.sources li { display: flex; align-items: baseline; gap: 10px; padding: 8px 0;
    border-bottom: 1px dashed var(--line); font-size: 14px; }
  ul.sources li:last-child { border-bottom: 0; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600;
    letter-spacing: 0.04em; text-transform: uppercase; }
  .badge.ok { background: #e6f2ec; color: var(--ok); }
  .badge.err { background: #f7e1e1; color: var(--err); }
  .source-title { flex: 1; }
  .source-meta { color: var(--muted); font-size: 13px; }
  .doc { border-bottom: 1px solid var(--line); padding: 12px 0; }
  .doc:last-child { border-bottom: 0; }
  .doc h3 { margin: 0 0 4px; font-size: 15px; }
  .doc .meta { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .doc .links { font-size: 13px; }
  .doc .links a { color: var(--accent); text-decoration: underline; margin-right: 12px; }
  code.path { background: #f0eee8; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
  .empty { color: var(--muted); font-style: italic; }
  .err-item { color: var(--err); font-size: 13px; padding: 4px 0; }
  @media (max-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<main>
  <header>
    <h1>ANPD Monitor</h1>
    <p id="run-at"></p>
    <p id="period"></p>
  </header>

  <div class="grid">
    <div class="kpi ok"><div class="n" id="k-new">0</div><div class="lbl">Nuevos</div></div>
    <div class="kpi"><div class="n" id="k-existing">0</div><div class="lbl">Ya registrados</div></div>
    <div class="kpi warn"><div class="n" id="k-manual">0</div><div class="lbl">Revisi&oacute;n manual</div></div>
    <div class="kpi err"><div class="n" id="k-errors">0</div><div class="lbl">Errores</div></div>
  </div>

  <section>
    <h2>Fuentes consultadas</h2>
    <ul class="sources" id="sources"></ul>
  </section>

  <section>
    <h2>Documentos nuevos</h2>
    <div id="new-docs"></div>
  </section>

  <section id="manual-section" hidden>
    <h2>Revisi&oacute;n manual</h2>
    <div id="manual-docs"></div>
  </section>

  <section id="errors-section" hidden>
    <h2>Errores</h2>
    <div id="errors"></div>
  </section>
</main>

<script id="report" type="application/json">{"run_at": "2026-07-18T17:14:15.759660-05:00", "period": {"start": "2026-07-11T17:14:15.759660-05:00", "end": "2026-07-18T17:14:15.759660-05:00"}, "sources": [{"key": "sancionadores", "title": "Resoluciones de los procedimientos sancionadores", "url": "https://www.gob.pe/institucion/anpd/colecciones/1801-resoluciones-de-los-procedimientos-sancionadores", "status": "ok", "candidates_seen": 25, "errors": []}, {"key": "arco", "title": "Decisiones sobre derechos ARCO", "url": "https://www.gob.pe/institucion/anpd/colecciones/1749-decisiones-sobre-derechos-arco-2017", "status": "ok", "candidates_seen": 25, "errors": []}, {"key": "opiniones", "title": "Opiniones consultivas emitidas por la ANPD", "url": "https://www.gob.pe/institucion/anpd/colecciones/1799-opiniones-consultivas-emitidas-por-la-anpd", "status": "ok", "candidates_seen": 25, "errors": []}], "summary": {"new_documents": 0, "existing_documents": 0, "errors": 0, "manual_review": 0}, "new_documents": [], "existing_documents": [], "manual_review": [], "errors": [], "no_news_message": "No se encontraron nuevas resoluciones, decisiones sobre derechos ARCO ni opiniones consultivas publicadas por la ANPD durante el periodo comprendido entre 2026-07-11T17:14:15.759660-05:00 y 2026-07-18T17:14:15.759660-05:00."}</script>
<script>
  const data = JSON.parse(document.getElementById("report").textContent);
  const fmt = iso => {
    if (!iso) return "-";
    const d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleString("es-PE", { dateStyle: "long", timeStyle: "short" });
  };
  const fmtDate = iso => {
    if (!iso) return "-";
    const d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleDateString("es-PE", { dateStyle: "long" });
  };
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // ponytail: URLs vienen del scraping (fuente externa); solo http/https en href, resto se descarta
  const safeUrl = u => /^https?:\/\//i.test(String(u || "")) ? esc(u) : "";

  document.getElementById("run-at").textContent = "Ejecutado: " + fmt(data.run_at);
  document.getElementById("period").textContent =
    "Periodo revisado: " + fmtDate(data.period.start) + " - " + fmtDate(data.period.end);
  document.getElementById("k-new").textContent = data.summary.new_documents;
  document.getElementById("k-existing").textContent = data.summary.existing_documents;
  document.getElementById("k-manual").textContent = data.summary.manual_review;
  document.getElementById("k-errors").textContent = data.summary.errors;

  document.getElementById("sources").innerHTML = data.sources.map(s => {
    const url = safeUrl(s.url);
    const title = url
      ? `<a href="${url}" target="_blank" rel="noopener">${esc(s.title)}</a>`
      : esc(s.title);
    return `
      <li>
        <span class="badge ${s.status === "ok" ? "ok" : "err"}">${esc(s.status)}</span>
        <span class="source-title">${title}</span>
        <span class="source-meta">${s.candidates_seen} candidatos</span>
      </li>`;
  }).join("");

  const renderDoc = d => {
    const pub = safeUrl(d.publication_url);
    const file = safeUrl(d.file_url);
    return `
    <div class="doc">
      <h3>${esc(d.title)}</h3>
      <div class="meta">
        ${esc(d.category)} &middot; publicado ${esc(fmtDate(d.publication_date))}
        ${d.number ? " &middot; N&deg; " + esc(d.number) : ""}
      </div>
      <div class="links">
        ${pub ? `<a href="${pub}" target="_blank" rel="noopener">Publicaci&oacute;n</a>` : ""}
        ${file ? `<a href="${file}" target="_blank" rel="noopener">PDF remoto</a>` : ""}
        ${d.local_path ? `<span>Local: <code class="path">${esc(d.local_path)}</code></span>` : ""}
      </div>
    </div>`;
  };

  const newDocs = document.getElementById("new-docs");
  if (data.new_documents.length) {
    newDocs.innerHTML = data.new_documents.map(renderDoc).join("");
  } else {
    newDocs.innerHTML = `<p class="empty">${esc(data.no_news_message || "Sin novedades en el periodo.")}</p>`;
  }

  if (data.manual_review.length) {
    document.getElementById("manual-section").hidden = false;
    document.getElementById("manual-docs").innerHTML = data.manual_review.map(renderDoc).join("");
  }

  if (data.errors.length) {
    document.getElementById("errors-section").hidden = false;
    document.getElementById("errors").innerHTML =
      data.errors.map(e => `<div class="err-item">${esc(e)}</div>`).join("");
  }
</script>
</body>
</html>
